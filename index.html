<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bogensee — Ausstellung</title>
<style>
  :root{
    --bg: #0c0c0c;
    --panel: #1b1b1b;
    --panel-edge: #333333;
    --ink: #ededed;
    --ink-dim: #9c9c9c;
    --accent: #e6e6e6;
    --caption-bg: rgba(12, 12, 12, 0.92);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: "Courier New", Courier, monospace;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #backdrop {
    position: fixed; inset: 0;
    z-index: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 140px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 140px);
    pointer-events: none;
  }

  .tick {
    position: fixed;
    font-size: 24px;
    letter-spacing: 0.02em;
    color: rgba(156,156,156,0.4);
    pointer-events: none;
    z-index: 1;
  }
  .tick.tl { top: 26px; left: 32px; }
  /* bottom line: project title left, authors right — together the block
     spans the full width, ending just before the Reset button */
  .tick.bl {
    bottom: 26px; left: 32px;
    right: 120px;                 /* 28px (Reset offset) + 64px (Reset width) + 28px gap */
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 120px;                   /* minimum distance between title and names */
    white-space: nowrap;
  }
  .tick-authors {
    font-size: 17px;              /* smaller than the 24px title */
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    color: rgba(156,156,156,0.22); /* more subdued than the title */
  }
  .tick.tr { top: 26px; right: 32px; }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 2;
  }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 3840px;
    height: 2160px;
    transform-origin: 0 0;
  }

  .item {
    position: absolute;
    overflow: visible;
  }

  .item-inner {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .tile-title {
    flex-shrink: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 25px;
    letter-spacing: 0.02em;
    color: var(--ink);
    background: var(--caption-bg);
    border: 1px solid rgba(255,255,255,0.14);
    border-bottom: none;
  }

  /* ---------- the actual DIN-A / 5:4 framed image box ---------- */
  .tile-frame {
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--panel);
    outline: 1px solid rgba(255,255,255,0.16);
    outline-offset: -1px;
  }
  .frame-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .frame-img.active { opacity: 1; }

  /* ---------- expandable per-layer legend, top-left of a map frame ---------- */
  .map-legend {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 6;
    font-family: "Courier New", Courier, monospace;
  }
  .map-legend.no-legend { display: none; }
  /* once zoomed in past the pin threshold, the legend is re-parented to
     <body> (see applyTransform) and pinned to a fixed screen position —
     exactly like the Reset button — instead of scrolling/zooming with
     the map underneath it */
  .map-legend.pinned {
    position: fixed;
    top: 50px; left: 50px;
    z-index: 25;
  }
  .legend-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    background: #000;
    border: 1px solid #000;
    border-radius: 2px;
    color: #fff;
    font-family: "Courier New", Courier, monospace;
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    touch-action: manipulation;
  }
  .legend-toggle svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2.4; flex-shrink: 0; transition: transform 0.2s ease; }
  .map-legend.open .legend-toggle svg { transform: rotate(45deg); }
  .legend-panel {
    display: none;
    margin-top: 6px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
  }
  .map-legend.open .legend-panel { display: block; }
  .legend-panel img {
    display: block;
    width: 390px;
    height: auto;
  }

  .finance-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 17px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    border-radius: 3px;
    touch-action: manipulation;
  }
  .finance-btn.active {
    color: var(--ink);
    background: rgba(255,255,255,0.14);
    border-color: var(--accent);
  }

  /* ---------- clickable number circles in the axo drawings → method ---------- */
  .method-hots {
    position: absolute; inset: 0;
    z-index: 4;
    pointer-events: none;
    display: none;
  }
  .method-hots.active { display: block; }
  .method-hot {
    position: absolute;
    aspect-ratio: 1;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    cursor: pointer;
    touch-action: manipulation;
  }
  .method-hot:hover { box-shadow: 0 0 0 3px #fff, 0 0 0 5px #00a05a; }
  .method-hot.debug { outline: 2px dashed red; }

  /* ---------- sequence controls: sits BELOW the frame, external ---------- */
  .seq-controls {
    flex-shrink: 0;
    height: 90px;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 26px;
    background: var(--caption-bg);
    border: 1px solid var(--panel-edge);
  }

  .seq-play-btn {
    width: 52px; height: 52px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--panel-edge);
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .seq-play-btn svg { width: 20px; height: 20px; fill: var(--ink); }

  .seq-timeline {
    position: relative;
    flex: 1;
    height: 100%;
  }
  .seq-line {
    position: absolute;
    left: 22px; right: 22px;
    top: 38%;
    height: 2px;
    background: rgba(255,255,255,0.16);
    transform: translateY(-50%);
  }
  .seq-point {
    position: absolute;
    top: 38%;
    width: 22px; height: 22px;
    margin-left: -11px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 1px solid var(--panel-edge);
    transform: translateY(-50%);
    touch-action: manipulation;
  }
  .seq-point.active { background: var(--accent); border-color: var(--accent); }
  .seq-date {
    position: absolute;
    top: calc(38% + 20px);
    transform: translateX(-50%);
    font-size: 16px;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
    white-space: nowrap;
    pointer-events: none;
  }
  .seq-date.active { color: var(--ink); }

  /* ---------- compact overlay nav: plain triangles sitting just beside the frame ---------- */
  .tile-frame.frame-overlaynav { overflow: visible; }
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    z-index: 5;
    touch-action: manipulation;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .nav-arrow.nav-prev {
    left: -16px;
    border-right: 20px solid var(--ink);
  }
  .nav-arrow.nav-next {
    right: -16px;
    border-left: 20px solid var(--ink);
  }

  /* ---------- map row: DIN-A/5:4 frame + tab column sitting OUTSIDE it ---------- */
  .map-row {
    display: flex;
    flex-shrink: 0;
  }

  .layer-tabs {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #161616;
    border: 1px solid var(--panel-edge);
    border-left: none;
  }
  .layer-tab {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 8px;
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
    border-bottom: 1px solid var(--panel-edge);
    border-left: 4px solid transparent;
    touch-action: manipulation;
  }
  .layer-tab:last-child { border-bottom: none; }
  .layer-tab.active {
    color: var(--ink);
    background: rgba(255,255,255,0.06);
    border-left: 4px solid var(--accent);
  }

  /* "eco upgrade" is a normal tab like any other; its 2x2 sub-grid flies
     out to the right, only while this tab is the active one */
  .layer-tab.gap-before { margin-top: 40px; position: relative; }
  .layer-tab.gap-before::before {
    content: '';
    position: absolute;
    top: -20px; left: 14px; right: 14px;
    border-top: 1px solid var(--panel-edge);
  }

  .layer-subgrid {
    position: absolute;
    top: 0; left: 100%;
    height: 100%;
    width: 240px;
    display: none;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    background: #161616;
    border: 1px solid var(--panel-edge);
    border-left: none;
    z-index: 50;
    box-shadow: 20px 0 40px -10px rgba(0,0,0,0.7);
  }
  .layer-tab.active .layer-subgrid { display: grid; }
  .layer-subgrid-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    color: var(--ink-dim);
    border-right: 1px solid var(--panel-edge);
    border-top: 1px solid var(--panel-edge);
    touch-action: manipulation;
  }
  .layer-subgrid-cell:nth-child(2n) { border-right: none; }
  .layer-subgrid-cell.active {
    color: var(--ink);
    background: rgba(255,255,255,0.1);
  }

  /* ---------- fixed reset button, unaffected by canvas zoom/pan ---------- */
  .reset-btn {
    position: fixed;
    bottom: 28px; right: 28px;
    z-index: 20;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(27,27,27,0.92);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.5);
    touch-action: manipulation;
  }
  .reset-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .reset-btn span {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  /* label curved along the lower arc of the circle (built in JS from the
     <span> text, see curveButtonLabels) */
  .reset-btn { position: fixed; }
  .reset-btn svg.btn-arc {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    stroke: none;
    pointer-events: none;
  }
  .btn-arc text {
    fill: var(--ink-dim);
    font-size: 11px;              /* same size as the old straight labels */
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ---------- fixed nav button to the Methods+Biotopes view, top-left; same look as .reset-btn ---------- */
  /* round buttons fade out when they're not relevant for the tile you've
     zoomed in on (see updateRoundButtons in JS) */
  #site-view .reset-btn { transition: opacity 0.25s ease; }
  #site-view .reset-btn.btn-hidden { opacity: 0; pointer-events: none; }

  /* ---------- Windows-XP-style tooltip, overview only (see JS) ---------- */
  #tooltip {
    position: fixed;
    z-index: 35;
    max-width: 440px;
    padding: 4px 8px 5px;
    background: #ffffe1;
    border: 1px solid #000;
    box-shadow: 2px 2px 3px rgba(0,0,0,0.45);
    color: #000;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    line-height: 1.35;
    pointer-events: none;
    display: none;
  }
  #tooltip.show { display: block; }
  #tooltip div + div { margin-top: 2px; }

  #methods-btn {
    top: 68px; left: 32px;
    bottom: auto; right: auto;
  }

  /* ---------- fixed nav button to the Biotope legend view, below Methods; same look ---------- */
  #biotope-btn {
    top: 146px; left: 32px;
    bottom: auto; right: auto;
  }

  /* ---------- "Legend" button top-left inside the plan frames: same look as
     the Map legend button, but jumps straight to the Biotope view ---------- */
  .plan-legend {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 6;
  }

  /* ---------- reopens the explanation slideshow, top-right; same look as .reset-btn ---------- */
  #explanation-btn {
    top: 68px; right: 32px;
    bottom: auto; left: auto;
  }

  /* ---------- back button, top-left, inside the Methods+Biotopes view; same look as .reset-btn ---------- */
  .doc-back {
    top: 26px; left: 32px;
    bottom: auto; right: auto;
  }

  /* ---------- Methods+Biotopes view: horizontally swipeable document ---------- */
  .doc-view {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--bg);
  }
  .hidden { display: none; }

  .doc-stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .doc-wrap {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
  }
  .doc-wrap img {
    display: block;
    pointer-events: none;
  }

  /* fine grid, sits behind the icons and scrolls slower (layered
     scroll-parallax). Always fills the whole screen (fixed, edge to
     edge) regardless of the icon layer's zoom level — only the pattern
     itself shifts with panning (background-position, see JS), it never
     shrinks down to the icons' fitted size. White background, black
     lines, per reference. */
  .doc-bg {
    position: fixed;
    inset: 0;
    background-color: #fff;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.35) 0, rgba(0,0,0,0.35) 1px, transparent 1px, transparent 68.4px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0, rgba(0,0,0,0.35) 1px, transparent 1px, transparent 116.8px);
  }

  /* "Unavailable" / "Available" scale: behaves exactly like normal
     canvas content (like the icons) — its Y position AND its own size
     both scale with docScale/docTy, so it visibly grows/shrinks and
     moves as you zoom/pan, same as everything else. The one difference:
     X always stays pinned to the left screen edge, never following
     horizontal pan — see positionDocScale() in JS. No edge-clamping. */
  .doc-scale-anchor {
    position: fixed;
    left: 26px;
    z-index: 15;
    transform-origin: left center;
    pointer-events: none;
  }
  .doc-axis-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: "Courier New", Courier, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.62);
    color: #fff;
    padding: 8px 6px;
  }
  #doc-scale-line {
    position: fixed;
    left: 39px;
    width: 1px;
    z-index: 14;
    background: rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #doc-scale-line::before, #doc-scale-line::after {
    content: '';
    position: absolute;
    left: 50%;
    border: 5px solid transparent;
  }
  #doc-scale-line::before {
    top: -1px;
    transform: translate(-50%, -100%);
    border-bottom-color: rgba(0,0,0,0.5);
  }
  #doc-scale-line::after {
    bottom: -1px;
    transform: translate(-50%, 100%);
    border-top-color: rgba(0,0,0,0.5);
  }

  /* ---------- section jump-nav, bottom-center, inside the Methods+Biotopes view ---------- */
  .section-nav {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
  }
  .section-nav-line {
    width: 40px;
    height: 1px;
    background: #000;
  }
  .section-btn {
    font-family: "Courier New", Courier, monospace;
    padding: 8px 16px;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #fff;
    background: #000;
    border: 1px solid #000;
    touch-action: manipulation;
  }
  .section-btn.active {
    font-weight: bold;
    padding: 13px 24px;
    font-size: 16px;
  }

  /* ---------- intro "explanation" slideshow: floats above the site on load ---------- */
  /* full-screen layer behind the window: blurs the site and swallows all
     taps/clicks, so nothing behind it can be operated while it's open */
  #expl-layer {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(12,12,12,0.15);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #expl-layer.hidden { display: none; }
  #explanation {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #explanation .tile-title { height: 44px; font-size: 18px; padding: 0 6px 0 16px; }
  .expl-close {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; cursor: pointer;
    touch-action: manipulation;
  }
  .expl-close svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.8; }
  #expl-frame {
    position: relative;
    overflow: hidden;
    background: #fff;
    outline: 1px solid rgba(255,255,255,0.16);
    outline-offset: -1px;
  }
  #expl-img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .expl-hot { position: absolute; cursor: pointer; touch-action: manipulation; }
  .expl-hot.debug { outline: 2px dashed red; background: rgba(255,0,0,0.08); }
</style>
</head>
<body>

<div id="site-view">

<div id="backdrop"></div>
<div class="tick tl">52.538503 N · 13.359849 E</div>
<div class="tick tr">52.774927 N · 13.52574 E</div>
<div class="tick bl"><span>COMPENSATION LAB e.V.</span><span class="tick-authors">by Claudius Kämpf, Domas Karazija, Selma Richter &amp; Mischa Ushakov</span></div>
<button id="methods-btn" class="reset-btn" type="button">
  <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  <span>Methods</span>
</button>
<button id="biotope-btn" class="reset-btn" type="button">
  <svg viewBox="0 0 24 24"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l8-8"/></svg>
  <span>Biotope</span>
</button>

<button id="explanation-btn" class="reset-btn" type="button">
  <svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.5 2.6c-.9.5-1.5 1.3-1.5 2.4v.5"/><path d="M12 18v.5"/></svg>
  <span>Explanation</span>
</button>

<div id="tooltip"></div>

<div id="stage">
  <div id="canvas"><!-- items injected by JS from CONFIG --></div>
</div>

<button id="reset-btn" class="reset-btn" aria-label="Zur Ausgangsansicht">
  <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 3v6h6"/></svg>
  <span>Reset</span>
</button>

</div>

<div id="expl-layer">
<div id="explanation">
  <div class="tile-title">
    <span>explanation</span>
    <button class="expl-close" type="button" aria-label="Schließen">
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div id="expl-frame">
    <img id="expl-img" src="intro1.jpg" alt="Project explanation">
  </div>
</div>
</div>

<div id="methods-view" class="doc-view hidden">
  <div id="methods-stage" class="doc-stage">
    <div id="doc-bg" class="doc-bg"></div>
    <div id="doc-wrap" class="doc-wrap">
      <img id="doc-img" class="doc-img" src="methods-icons.png" alt="Methods and Biotopes — Compensation Lab e.V.">
    </div>
  </div>

  <div class="doc-scale-anchor" id="scale-anchor-top">
    <div class="doc-axis-label">Unavailable</div>
  </div>
  <div id="doc-scale-line"></div>
  <div class="doc-scale-anchor" id="scale-anchor-bottom">
    <div class="doc-axis-label">Available</div>
  </div>

  <button id="back-btn" class="reset-btn doc-back" type="button">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Places</span>
  </button>

  <button id="doc-reset-btn" class="reset-btn doc-reset" aria-label="Zur Ausgangsansicht">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 3v6h6"/></svg>
    <span>Reset</span>
  </button>

  <div id="section-nav" class="section-nav">
    <button class="section-btn" type="button" data-x="1000">Organizing</button>
    <div class="section-nav-line"></div>
    <button class="section-btn" type="button" data-x="3000">Creating</button>
    <div class="section-nav-line"></div>
    <button class="section-btn" type="button" data-x="5000">Maintaining</button>
    <div class="section-nav-line"></div>
    <button class="section-btn" type="button" data-x="7000">Monitoring</button>
  </div>
</div>

<div id="biotope-view" class="doc-view hidden">
  <div class="doc-stage">
    <div class="doc-bg"></div>
    <div class="doc-wrap">
      <img class="doc-img" src="biotope-legende.png" alt="Biotope legend — Compensation Lab e.V.">
    </div>
  </div>

/* ============================================================

   ============================================================ */
const CANVAS_W = 3840, CANVAS_H = 2160;
// Zoom-out knob (kept at 1 — the permanent page-level `zoom` in the CSS above
// now does the "smaller + pushed together" effect for the whole page).
const SIZE_SCALE = 0.83;
const canvas = document.getElementById('canvas');
const stage = document.getElementById('stage');

// Prevent the browser's own page-zoom (trackpad pinch / ctrl+scroll / Safari
// gesture events) from engaging — otherwise it fights with our custom canvas
// zoom and can visually detach "position: fixed" elements like the reset
// button. Instead, we redirect trackpad pinch into our own canvas zoom, so
// testing on a laptop trackpad behaves the same as pinching on the real
// touchscreen.
function zoomAt(clientX, clientY, newScaleRaw) {
  const newScale = Math.max(MIN_SCALE, Math.min(newScaleRaw, MAX_SCALE));
  const rect = stage.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const canvasX = (mx - tx) / scale;
  const canvasY = (my - ty) / scale;
  tx = mx - canvasX * newScale;
  ty = my - canvasY * newScale;
  scale = newScale;
  applyTransform();
}

let currentView = 'site';

document.addEventListener('wheel', (e) => {
  if (currentView !== 'site') return;
  if (isExplOpen()) { if (e.ctrlKey) e.preventDefault(); return; }
  if (e.ctrlKey) {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.01);
    zoomAt(e.clientX, e.clientY, scale * factor);
  }
}, { passive: false });

let gestureBaseScale = 1;
document.addEventListener('gesturestart', (e) => {
  if (currentView !== 'site') return;
  e.preventDefault();
  if (isExplOpen()) return;
  gestureBaseScale = scale;
});
document.addEventListener('gesturechange', (e) => {
  if (currentView !== 'site') return;
  e.preventDefault();
  if (isExplOpen()) return;
  zoomAt(e.clientX, e.clientY, gestureBaseScale * e.scale);
});
document.addEventListener('gestureend', (e) => { if (currentView === 'site') e.preventDefault(); });

        pointEls.push(pt);

        const dateLabel = document.createElement('div');
        dateLabel.className = 'seq-date' + (i === 0 ? ' active' : '');
        dateLabel.style.left = leftExpr;
        dateLabel.textContent = (entry.dates && entry.dates[i]) || ('Datum ' + (i + 1));
        timeline.appendChild(dateLabel);
      });

      if (playBtn) controls.appendChild(playBtn);
      controls.appendChild(timeline);
      inner.appendChild(frame);
      inner.appendChild(controls);
    }

    if (entry.biotopeLegend) {
      const bl = document.createElement('div');
      bl.className = 'plan-legend';
      bl.innerHTML = '<button class="legend-toggle bio-legend-btn" type="button">'
        + '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg><span>Legend</span></button>';
      frame.appendChild(bl);
    }

    let financeImg = null, financeBtn = null;
    if (entry.finance) {
      financeImg = document.createElement('img');
      financeImg.className = 'frame-img';
      financeImg.src = entry.finance;
      financeImg.alt = entry.label + ' – Finance';
      frame.appendChild(financeImg);

      financeBtn = document.createElement('div');
      financeBtn.className = 'finance-btn';
      financeBtn.textContent = 'Finance';
      titleEl.appendChild(financeBtn);
    }

    sequenceState.set(item, {
      imgEls, tickEls: pointEls, dateEls: timeline ? timeline.querySelectorAll('.seq-date') : [],
      playBtn, idx: 0, playing: false, timer: null,
      financeImg, financeBtn, financeActive: false,
      navPrev, navNext, counterEl, hotGroups
    });

  } else if (entry.type === 'layered') {
    const row = document.createElement('div');
    row.className = 'map-row';
    row.style.height = frameH + 'px';

    const frame = document.createElement('div');
    frame.className = 'tile-frame';
    frame.style.width = w + 'px';
    frame.style.height = '100%';

    const tabsCol = document.createElement('div');
    tabsCol.className = 'layer-tabs';
    tabsCol.style.width = TABS_W + 'px';
    tabsCol.style.height = '100%';

    const legendWrap = document.createElement('div');
    legendWrap.className = 'map-legend no-legend';
    const legendToggle = document.createElement('button');
    legendToggle.className = 'legend-toggle';
    legendToggle.type = 'button';
    legendToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Legend</span>';
    const legendPanel = document.createElement('div');
    legendPanel.className = 'legend-panel';
    const legendImg = document.createElement('img');
    legendImg.alt = 'Legend';
    legendPanel.appendChild(legendImg);
    legendWrap.appendChild(legendToggle);
    legendWrap.appendChild(legendPanel);
    frame.appendChild(legendWrap);
    legendWrap._homeParent = frame;

    // While pinned, the legend lives outside #stage (see applyTransform),
    // so #stage's own tap-detection never sees clicks on it anymore —
    // a plain click listener (same approach as the Reset button) covers
    // that case. While NOT pinned, #stage's hit-test already handles the
    // toggle, so this listener stays a no-op then to avoid double-toggling.
    legendToggle.addEventListener('click', () => {
      if (legendWrap.classList.contains('pinned')) {
        legendWrap.classList.toggle('open');
        applyTransform(); // closing it un-pins it back into the map
      }
    });
    item._legendWrap = legendWrap; // stays reachable while pinned outside the tile

    let firstAssigned = false;

    entry.layers.forEach((layer) => {
      const img = document.createElement('img');
      img.className = 'frame-img' + (!firstAssigned ? ' active' : '');
      img.src = layer.src;
      img.alt = layer.tab;
      frame.appendChild(img);

      const tab = document.createElement('div');
      tab.className = 'layer-tab' + (layer.gapBefore ? ' gap-before' : '');
      tab.textContent = layer.tab;
      tab._img = img;
      tab._legend = layer.legend || null;
      if (!firstAssigned) {
        tab.classList.add('active');
        firstAssigned = true;
        if (layer.legend) {
          legendImg.src = layer.legend;
          legendWrap.classList.remove('no-legend');
        }
      }

      if (layer.subGrid) {
        const grid = document.createElement('div');
        grid.className = 'layer-subgrid';
        layer.subGrid.forEach((sub) => {
          const simg = document.createElement('img');
          simg.className = 'frame-img';
          simg.src = sub.src;
          simg.alt = sub.tab;
          frame.appendChild(simg);

          const cell = document.createElement('div');
          cell.className = 'layer-subgrid-cell';
          cell.textContent = sub.tab;
          cell._img = simg;
          cell._legend = sub.legend || null;
          grid.appendChild(cell);
        });
        tab.appendChild(grid);
      }
      tabsCol.appendChild(tab);
    });

    row.appendChild(frame);
    row.appendChild(tabsCol);
    inner.appendChild(row);

  } else if (entry.type === 'image') {
    const frame = document.createElement('div');
    frame.className = 'tile-frame';
    frame.style.height = frameH + 'px';

    const img = document.createElement('img');
    img.className = 'frame-img active';
    img.src = entry.src;
    img.alt = entry.label;
    frame.appendChild(img);

    inner.appendChild(frame);

  } else if (entry.type === 'section') {
    // text section — title bar + frame; shows entry.src once supplied,
    // stays an empty dark frame until then
    const frame = document.createElement('div');
    frame.className = 'tile-frame';
    frame.style.height = frameH + 'px';
    if (entry.src) {
      const img = document.createElement('img');
      img.className = 'frame-img active';
      img.src = entry.src;
      img.alt = entry.label;
      frame.appendChild(img);
    }
    inner.appendChild(frame);
  }

  // which round button belongs to this tile (shown while zoomed in on it)
  item._relevantBtn = entry.methodLinks ? 'methods-btn'
                    : entry.biotopeLegend ? 'biotope-btn'
                    : null;

  item._hint = entry.hint || null;

  canvas.appendChild(item);
});

// --- sequence player logic ---
function seqSetActive(state, idx) {
  state.idx = idx;
  if (state.financeActive) {
    state.financeActive = false;
    if (state.financeImg) state.financeImg.classList.remove('active');
    if (state.financeBtn) state.financeBtn.classList.remove('active');
  }
  state.imgEls.forEach((im, k) => im.classList.toggle('active', k === idx));
  if (state.hotGroups) state.hotGroups.forEach((g, k) => g.classList.toggle('active', k === idx));
  state.tickEls.forEach((t, k) => t.classList.toggle('active', k === idx));
  state.dateEls.forEach((d, k) => d.classList.toggle('active', k === idx));
  if (state.counterEl) state.counterEl.textContent = (idx + 1) + ' / ' + state.imgEls.length;
}
function seqStart(state) {
  if (state.playing) return;
  state.playing = true;
  state.playBtn.innerHTML = PAUSE_SVG;
  state.timer = setInterval(() => {
    seqSetActive(state, (state.idx + 1) % state.imgEls.length);
  }, 1100);
}
function seqStop(state) {
  state.playing = false;
  state.playBtn.innerHTML = PLAY_SVG;
  clearInterval(state.timer);
}
function financeToggle(state) {
  state.financeActive = !state.financeActive;
  if (state.financeActive) {
    seqStop(state);
    state.imgEls.forEach((im) => im.classList.remove('active'));
    if (state.hotGroups) state.hotGroups.forEach((g) => g.classList.remove('active'));
    state.financeImg.classList.add('active');
    state.financeBtn.classList.add('active');
  } else {
    state.financeImg.classList.remove('active');
    state.financeBtn.classList.remove('active');
    state.imgEls[state.idx].classList.add('active');
  }
}

// --- layered-map selection: one shared "active" state across all tabs
// and sub-grid cells within a tile, whichever was tapped last ---
function mapSelect(item, chosenEl) {
  item.querySelectorAll('.layer-tab').forEach((t) => t.classList.remove('active'));
  item.querySelectorAll('.layer-subgrid-cell').forEach((c) => c.classList.remove('active'));
  const parentTab = chosenEl.classList.contains('layer-tab') ? chosenEl : chosenEl.closest('.layer-tab');
  if (parentTab) parentTab.classList.add('active');
  chosenEl.classList.add('active');
  item.querySelectorAll('.frame-img').forEach((im) => im.classList.toggle('active', im === chosenEl._img));

  // swap this tile's legend to match the newly active layer/sub-cell
  // (a sub-grid cell can have its own legend; falls back to the parent
  // layer's legend if the cell doesn't define one)
  const legendWrap = item._legendWrap;
  if (legendWrap && parentTab) {
    const legendSrc = (chosenEl._legend != null) ? chosenEl._legend : parentTab._legend;
    if (legendSrc) {
      legendWrap.querySelector('.legend-panel img').src = legendSrc;
      legendWrap.classList.remove('no-legend');
    } else {
      legendWrap.classList.add('no-legend');
      legendWrap.classList.remove('open');
      applyTransform();
    }
  }
}

// --- pan & zoom (pointer-events based, multi-touch pinch) ---
let scale = 1, tx = 0, ty = 0;
const MIN_SCALE = 0.35, MAX_SCALE = 8;
const pointers = new Map();
let dragMoved = false;
let lastDist = null;
let lastSingle = null;

const LEGEND_PIN_THRESHOLD = 1; // zoom level past which legends detach and pin to the screen

// ---- round buttons: only show what's relevant for the tile in view ----
// In the overview all buttons are visible. Once zoomed in, the tile that
// takes up most of the screen decides: Methods only for the program (axo)
// tiles, Biotope only for the development (plan) tiles, Explanation never,
// Reset always.
const ZOOMED_IN_FACTOR = 2.3; // "zoomed in" = more than 1.3× the overview zoom
let overviewScale = 1;
const ROUND_BTN_IDS = ['methods-btn', 'biotope-btn', 'explanation-btn'];

function updateRoundButtons() {
  const zoomedIn = scale > overviewScale * ZOOMED_IN_FACTOR;
  let relevant = null;
  if (zoomedIn) {
    const vw = window.innerWidth, vh = window.innerHeight;
    let bestArea = 0;
    canvas.querySelectorAll('.item').forEach((it) => {
      const l = it.offsetLeft * scale + tx, t = it.offsetTop * scale + ty;
      const r = l + it.offsetWidth * scale, b = t + it.offsetHeight * scale;
      const area = Math.max(0, Math.min(r, vw) - Math.max(l, 0)) * Math.max(0, Math.min(b, vh) - Math.max(t, 0));
      if (area > bestArea) { bestArea = area; relevant = it._relevantBtn; }
    });
  }
  ROUND_BTN_IDS.forEach((id) => {
    const show = !zoomedIn || id === relevant;
    document.getElementById(id).classList.toggle('btn-hidden', !show);
  });
}

// ---- XP-style tooltip: in the overview, hovering a tile shows what's
// in it. Mouse only (a touchscreen has no hover), off once zoomed in.
const TOOLTIP_DELAY = 400;            // ms before it appears
const TOOLTIP_OFFSET_X = 14, TOOLTIP_OFFSET_Y = 22; // below-right of the cursor, like XP
const tooltipEl = document.getElementById('tooltip');
let tooltipItem = null, tooltipTimer = null, tooltipX = 0, tooltipY = 0;

function hideTooltip() {
  clearTimeout(tooltipTimer);
  tooltipTimer = null;
  tooltipItem = null;
  tooltipEl.classList.remove('show');
}
function placeTooltip() {
  const w = tooltipEl.offsetWidth, h = tooltipEl.offsetHeight;
  let x = tooltipX + TOOLTIP_OFFSET_X, y = tooltipY + TOOLTIP_OFFSET_Y;
  if (x + w > window.innerWidth - 8) x = tooltipX - w - 6;   // flip left at the right edge
  if (y + h > window.innerHeight - 8) y = tooltipY - h - 8;  // flip up at the bottom edge
  tooltipEl.style.left = x + 'px';
  tooltipEl.style.top = y + 'px';
}
function tooltipAllowed() {
  return currentView === 'site' && !isExplOpen() && pointers.size === 0
    && scale <= overviewScale * ZOOMED_IN_FACTOR;
}
stage.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  tooltipX = e.clientX; tooltipY = e.clientY;
  if (!tooltipAllowed()) { hideTooltip(); return; }
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const item = hit ? hit.closest('.item') : null;
  if (!item || !item._hint) { hideTooltip(); return; }
  if (item !== tooltipItem) {
    hideTooltip();
    tooltipItem = item;
    tooltipTimer = setTimeout(() => {
      const h = item._hint;
      tooltipEl.innerHTML = '';
      [['What', h.what], ['Tip', h.tip]].forEach(([k, v]) => {
        if (!v) return;
        const line = document.createElement('div');
        line.textContent = k + ': ' + v;
        tooltipEl.appendChild(line);
      });
      tooltipEl.classList.add('show');
      placeTooltip();
    }, TOOLTIP_DELAY);
  } else if (tooltipEl.classList.contains('show')) {
    placeTooltip();
  }
});
stage.addEventListener('pointerleave', hideTooltip);
stage.addEventListener('pointerdown', hideTooltip);
stage.addEventListener('wheel', hideTooltip, { passive: true });

function applyTransform() {
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  updateRoundButtons();
  // Map legends: below the threshold they're normal canvas content (scale
  // with everything else, so they don't balloon in size when zoomed out).
  // Past the threshold, detach them from the canvas and pin them to a
  // fixed screen position — exactly like the Reset button — so they stay
  // put and readable while you explore details deeper inside the map.
  // Only an OPEN legend pins — a closed one has nothing to keep readable,
  // so its button just stays in the map like normal content.
  document.querySelectorAll('.map-legend').forEach((el) => {
    const shouldPin = scale > LEGEND_PIN_THRESHOLD && el.classList.contains('open');
    const isPinned = el.classList.contains('pinned');
    if (shouldPin && !isPinned) {
      el.classList.add('pinned');
      document.body.appendChild(el);
    } else if (!shouldPin && isPinned) {
      el.classList.remove('pinned');
      el._homeParent.insertBefore(el, el._homeParent.firstChild);
    }
  });
}

// --- click on a tile's title bar: zoom in on that tile ---
function zoomToItem(item, padding = 60) {
  const w = item.offsetWidth, h = item.offsetHeight;
  const x = item.offsetLeft, y = item.offsetTop;
  const vw = window.innerWidth, vh = window.innerHeight;
  const newScale = Math.max(MIN_SCALE, Math.min(
    Math.min(vw / (w + padding * 2), vh / (h + padding * 2)),
    MAX_SCALE
  ));
  scale = newScale;
  tx = (vw - w * scale) / 2 - x * scale;
  ty = (vh - h * scale) / 2 - y * scale;
  applyTransform();
}

function centerCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const fitScale = Math.min(vw / CANVAS_W, vh / CANVAS_H);
  overviewScale = fitScale;
  scale = Math.max(MIN_SCALE, Math.min(fitScale, MAX_SCALE));
  tx = (vw - CANVAS_W * scale) / 2;
  ty = (vh - CANVAS_H * scale) / 2;
  applyTransform();
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

stage.addEventListener('pointerdown', (e) => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragMoved = false;
  if (pointers.size === 1) {
    lastSingle = { x: e.clientX, y: e.clientY };
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    lastDist = dist(pts[0], pts[1]);
  }
});

stage.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && lastSingle) {
    const dx = e.clientX - lastSingle.x;
    const dy = e.clientY - lastSingle.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    tx += dx; ty += dy;
    lastSingle = { x: e.clientX, y: e.clientY };
    applyTransform();
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    const d = dist(pts[0], pts[1]);
    const m = mid(pts[0], pts[1]);
    if (lastDist) {
      const factor = d / lastDist;
      const newScale = Math.max(MIN_SCALE, Math.min(scale * factor, MAX_SCALE));
      const rect = stage.getBoundingClientRect();
      const mx = m.x - rect.left, my = m.y - rect.top;
      const canvasX = (mx - tx) / scale;
      const canvasY = (my - ty) / scale;
      tx = mx - canvasX * newScale;
      ty = my - canvasY * newScale;
      scale = newScale;
      dragMoved = true;
      applyTransform();
    }
    lastDist = d;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) { lastDist = null; }
  if (pointers.size === 1) {
    lastSingle = Array.from(pointers.values())[0];
  } else if (pointers.size === 0) {
    lastSingle = null;
  }
}

// Unified tap handling: the stage holds pointer capture (needed for smooth
// pan/pinch), so a plain "click" on a nested control is not reliable across
// browsers/input types. Instead we look up what's actually under the
// pointer at release time and act on it directly.
let lastTap = 0;

function handlePointerUp(e) {
  const wasSinglePointer = pointers.size === 1;
  endPointer(e);

  if (!wasSinglePointer || dragMoved) { lastTap = 0; return; }

  const target = document.elementFromPoint(e.clientX, e.clientY);
  let hitInteractive = false;

  if (target) {
    const bioLegendEl = target.closest('.bio-legend-btn');
    const methodHotEl = target.closest('.method-hot');
    const cellEl = target.closest('.layer-subgrid-cell');
    const tabEl = !cellEl ? target.closest('.layer-tab') : null;
    const legendToggleEl = target.closest('.legend-toggle');
    const financeBtnEl = target.closest('.finance-btn');
    const titleEl = !financeBtnEl ? target.closest('.tile-title') : null;
    const playBtnEl = !financeBtnEl ? target.closest('.seq-play-btn') : null;
    const tickEl = !playBtnEl && !financeBtnEl ? target.closest('.seq-point') : null;
    const navPrevEl = !tickEl && !playBtnEl && !financeBtnEl ? target.closest('.nav-prev') : null;
    const navNextEl = !navPrevEl && !tickEl && !playBtnEl && !financeBtnEl ? target.closest('.nav-next') : null;

    if (methodHotEl) {
      hitInteractive = true;
      showMethod(Number(methodHotEl.dataset.method));
    } else if (bioLegendEl) {
      hitInteractive = true;
      showBiotopeView();
    } else if (cellEl) {
      hitInteractive = true;
      mapSelect(cellEl.closest('.item'), cellEl);
    } else if (tabEl) {
      hitInteractive = true;
      mapSelect(tabEl.closest('.item'), tabEl);
    } else if (legendToggleEl) {
      hitInteractive = true;
      legendToggleEl.closest('.map-legend').classList.toggle('open');
      applyTransform(); // opening it while zoomed in pins it to the screen
    } else if (financeBtnEl) {
      hitInteractive = true;
      const item = financeBtnEl.closest('.item');
      const state = sequenceState.get(item);
      if (state) { financeToggle(state); }
    } else if (titleEl) {
      hitInteractive = true;
      zoomToItem(titleEl.closest('.item'));
    } else if (playBtnEl) {
      hitInteractive = true;
      const item = playBtnEl.closest('.item');
      const state = sequenceState.get(item);
      if (state) { state.playing ? seqStop(state) : seqStart(state); }
    } else if (tickEl) {
      hitInteractive = true;
      const item = tickEl.closest('.item');
      const state = sequenceState.get(item);
      if (state) {
        const idx = state.tickEls.indexOf(tickEl);
        seqStop(state);
        seqSetActive(state, idx);
      }
    } else if (navPrevEl) {
      hitInteractive = true;
      const item = navPrevEl.closest('.item');
      const state = sequenceState.get(item);
      if (state) seqSetActive(state, (state.idx - 1 + state.imgEls.length) % state.imgEls.length);
    } else if (navNextEl) {
      hitInteractive = true;
      const item = navNextEl.closest('.item');
      const state = sequenceState.get(item);
      if (state) seqSetActive(state, (state.idx + 1) % state.imgEls.length);
    }
  }

  if (!hitInteractive) {
    const now = Date.now();
    if (now - lastTap < 300) centerCanvas();
    lastTap = now;
  } else {
    lastTap = 0;
  }
}

stage.addEventListener('pointerup', handlePointerUp);
stage.addEventListener('pointercancel', endPointer);

document.getElementById('reset-btn').addEventListener('click', centerCanvas);
window.addEventListener('resize', centerCanvas);
centerCanvas();

// ============================================================
// Full-screen document views (same page, not separate pages):
// "Methods" and "Biotope" legend. Each shows one wide image on the
// parallax grid, pannable/zoomable, with section jump-buttons at the
// bottom. Both are built by makeDocView() below.
// ============================================================
const siteView = document.getElementById('site-view');

const DOC_MAX_SCALE_FACTOR = 6;
const BG_PARALLAX = 0.55; // background grid moves slower than the image (< 1 = slower)

function makeDocView(cfg) {
  const view = document.getElementById(cfg.viewId);
  const stageEl = view.querySelector('.doc-stage');
  const wrap = view.querySelector('.doc-wrap');
  const bg = view.querySelector('.doc-bg');
  const img = view.querySelector('.doc-img');
  const btns = Array.from(view.querySelectorAll('.section-btn'));
  const v = { name: cfg.name, view, W: cfg.W, H: cfg.H, scale: 1, tx: 0, ty: 0, fit: 1 };

  function sizeImg() { img.style.width = v.W + 'px'; img.style.height = v.H + 'px'; }
  sizeImg();
  // optional: take the real pixel size from the image file once loaded
  if (cfg.sizeFromImage) {
    const take = () => {
      if (!img.naturalWidth) return;
      v.W = img.naturalWidth; v.H = img.naturalHeight;
      sizeImg();
      if (currentView === v.name) center();
    };
    if (img.complete) take();
    img.addEventListener('load', take);
  }

  // section position: data-x = center in document pixels (Methods);
  // data-from / data-to = section's horizontal range as share of the
  // image width (Biotope) — jumping there zooms in so the section fills the screen
  const hasRange = (b) => b.dataset.from != null;
  function secX(b) {
    return hasRange(b) ? (Number(b.dataset.from) + Number(b.dataset.to)) / 2 * v.W : Number(b.dataset.x);
  }

  function apply() {
    wrap.style.transform = `translate(${v.tx}px, ${v.ty}px) scale(${v.scale})`;
    // layered scroll-parallax: the grid only shifts its pattern, at a
    // fraction of the image's speed, so it reads as sitting further back
    bg.style.backgroundPosition = `${v.tx * BG_PARALLAX}px ${v.ty * BG_PARALLAX}px`;
    if (cfg.onTransform) cfg.onTransform(v);
    // highlight whichever section is centered — updates continuously while panning
    const cx = (window.innerWidth / 2 - v.tx) / v.scale;
    let best = null, bestD = Infinity;
    // range sections: the one with the largest share of itself on screen wins;
    // point sections (Methods): the one closest to the screen center
    const visL = -v.tx / v.scale, visR = (window.innerWidth - v.tx) / v.scale;
    btns.forEach((b) => {
      let d;
      if (hasRange(b)) {
        const L = Number(b.dataset.from) * v.W, R = Number(b.dataset.to) * v.W;
        d = -(Math.min(visR, R) - Math.max(visL, L)) / (R - L);
      } else {
        d = Math.abs(secX(b) - cx);
      }
      if (d < bestD) { bestD = d; best = b; }
    });
    btns.forEach((b) => b.classList.toggle('active', b === best));
  }

  function clamp() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = v.W * v.scale, h = v.H * v.scale;
    v.tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, v.tx));
    v.ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, v.ty));
  }

  function center() {
    const vw = window.innerWidth, vh = window.innerHeight;
    v.fit = cfg.fitScale(vw, vh, v.W, v.H);
    v.scale = v.fit;
    v.tx = (vw - v.W * v.scale) / 2;
    v.ty = 0;
    clamp();
    apply();
  }

  function zoomAt(clientX, clientY, raw) {
    const s = Math.max(v.fit, Math.min(raw, v.fit * DOC_MAX_SCALE_FACTOR));
    const rect = stageEl.getBoundingClientRect();
    const mx = clientX - rect.left, my = clientY - rect.top;
    const dx = (mx - v.tx) / v.scale, dy = (my - v.ty) / v.scale;
    v.tx = mx - dx * s;
    v.ty = my - dy * s;
    v.scale = s;
    clamp();
    apply();
  }

  stageEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey) {
      zoomAt(e.clientX, e.clientY, v.scale * Math.exp(-e.deltaY * 0.01));
    } else {
      // plain trackpad swipe pans, so a two-finger swipe moves through the document
      v.tx -= e.deltaX;
      v.ty -= e.deltaY;
      clamp();
      apply();
    }
  }, { passive: false });

  let gestureBase = 1;
  stageEl.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureBase = v.scale; });
  stageEl.addEventListener('gesturechange', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, gestureBase * e.scale); });
  stageEl.addEventListener('gestureend', (e) => e.preventDefault());

  const ptrs = new Map();
  let lastSingle = null, lastDist = null;
  const pdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  stageEl.addEventListener('pointerdown', (e) => {
    stageEl.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) lastSingle = { x: e.clientX, y: e.clientY };
    else if (ptrs.size === 2) lastDist = pdist(...Array.from(ptrs.values()));
  });
  stageEl.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1 && lastSingle) {
      v.tx += e.clientX - lastSingle.x;
      v.ty += e.clientY - lastSingle.y;
      lastSingle = { x: e.clientX, y: e.clientY };
      clamp();
      apply();
    } else if (ptrs.size === 2) {
      const pts = Array.from(ptrs.values());
      const d = pdist(pts[0], pts[1]);
      const m = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      if (lastDist) zoomAt(m.x, m.y, v.scale * (d / lastDist));
      lastDist = d;
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) lastDist = null;
    lastSingle = ptrs.size === 1 ? Array.from(ptrs.values())[0] : null;
  }
  stageEl.addEventListener('pointerup', endPtr);
  stageEl.addEventListener('pointercancel', endPtr);

  view.querySelector('.doc-reset').addEventListener('click', center);

  // jump to a named section at the overview zoom level
  btns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      if (hasRange(btn)) {
        const rangeW = (Number(btn.dataset.to) - Number(btn.dataset.from)) * v.W;
        v.scale = Math.max(v.fit, Math.min(vw / rangeW, vh / v.H) * 0.92);
      } else {
        v.scale = v.fit;
      }
      v.tx = vw / 2 - secX(btn) * v.scale;
      v.ty = 0;
      clamp();
      apply();
    });
  });

  // zoom in on a document point, centered on screen
  v.focus = (x, y, zoomFactor) => {
    const vw = window.innerWidth, vh = window.innerHeight;
    v.scale = Math.min(v.fit * zoomFactor, v.fit * DOC_MAX_SCALE_FACTOR);
    v.tx = vw / 2 - x * v.scale;
    v.ty = vh / 2 - y * v.scale;
    clamp();
    apply();
  };
  v.center = center;
  return v;
}

// ---- "Unavailable" / "Available" scale (Methods view only) ----
// Behaves exactly like normal canvas content: its Y position AND its own
// size both scale with the view's zoom/pan, so it visibly grows/shrinks
// and moves. The only difference: X always stays pinned to the left
// screen edge, never following horizontal pan. No edge-clamping.
const METHODS_DOC_H = 1196;
const SCALE_TOP_DOC_Y = 350;                    // anchor slightly inside the real top edge
const SCALE_BOTTOM_DOC_Y = METHODS_DOC_H - 450; // anchor slightly inside the real bottom edge
const scaleAnchorTop = document.getElementById('scale-anchor-top');
const scaleAnchorBottom = document.getElementById('scale-anchor-bottom');
const scaleLine = document.getElementById('doc-scale-line');

function positionDocScale(v) {
  const topY = SCALE_TOP_DOC_Y * v.scale + v.ty;
  const bottomY = SCALE_BOTTOM_DOC_Y * v.scale + v.ty;
  scaleAnchorTop.style.top = topY + 'px';
  scaleAnchorTop.style.transform = `translateY(-50%) scale(${v.scale})`;
  scaleAnchorBottom.style.top = bottomY + 'px';
  scaleAnchorBottom.style.transform = `translateY(-50%) scale(${v.scale})`;
  scaleLine.style.top = topY + 'px';
  scaleLine.style.height = Math.max(0, bottomY - topY) + 'px';
}

const docViews = {
  methods: makeDocView({
    name: 'methods', viewId: 'methods-view',
    W: 8000, H: METHODS_DOC_H, // native size of methods-icons.png / grid
    // noticeably smaller than a full edge-to-edge fit, so icon/text blocks don't overlap in the overview
    fitScale: (vw, vh, W, H) => (vh / H) * 0.82,
    onTransform: positionDocScale
  }),
  biotope: makeDocView({
    name: 'biotope', viewId: 'biotope-view',
    W: 2000, H: 850, sizeFromImage: true, // real size is read from biotope-legende.png
    fitScale: (vw, vh, W, H) => Math.min(vw / W, vh / H) * 0.9
  })
};

// ---- view switching ----
function showDocView(name) {
  hideTooltip();
  currentView = name;
  siteView.classList.add('hidden');
  Object.entries(docViews).forEach(([n, dv]) => dv.view.classList.toggle('hidden', n !== name));
  docViews[name].center();
}
function showSiteView() {
  currentView = 'site';
  Object.values(docViews).forEach((dv) => dv.view.classList.add('hidden'));
  siteView.classList.remove('hidden');
}
function showBiotopeView() { showDocView('biotope'); }

// ---- jump from a numbered circle in an axo to its method ----
const METHOD_ZOOM = 2.5;                 // zoom relative to the Methods overview
const METHOD_FOCUS_DX = 90, METHOD_FOCUS_DY = 30; // center slightly right/below the number, on the method block
function showMethod(n) {
  showDocView('methods');
  const p = METHOD_POS[n];
  if (!p) return;
  const dv = docViews.methods;
  dv.focus(p[0] + METHOD_FOCUS_DX, p[1] + METHOD_FOCUS_DY, METHOD_ZOOM);
}

document.getElementById('methods-btn').addEventListener('click', () => showDocView('methods'));
document.getElementById('biotope-btn').addEventListener('click', showBiotopeView);
document.querySelectorAll('.doc-back').forEach((b) => b.addEventListener('click', showSiteView));

window.addEventListener('resize', () => {
  if (docViews[currentView]) docViews[currentView].center();
});

// ============================================================
// Intro "explanation" slideshow (intro1.jpg … intro14.jpg)
// The buttons/arrows are printed in the slide images themselves, so
// invisible click areas (hotspots) sit on top of them. Values are in
// % of the slide: x, y = top-left corner, w, h = size.
// SHOW_HOTSPOTS = true outlines them in red for fine-tuning.
// ============================================================
const EXPL_COUNT = 14;
const EXPL_SRC = (i) => 'intro' + (i + 1) + '.jpg';
const SHOW_HOTSPOTS = false;
const EXPL_HOT = {
  first:  [ { action: 'close', x: 10, y: 79, w: 23, h: 12 },   // "skip to website"
            { action: 'next',  x: 67, y: 79, w: 31, h: 12 } ], // "project explanation" + arrow
  middle: [ { action: 'prev',  x: 2,  y: 80, w: 9,  h: 12 },
            { action: 'next',  x: 89, y: 80, w: 9,  h: 12 } ],
  last:   [ { action: 'prev',  x: 2,  y: 80, w: 9,  h: 12 },
            { action: 'close', x: 83, y: 80, w: 16, h: 12 } ]  // "wow, show results!"
};
const EXPL_W_MAX = 0.88, EXPL_H_MAX = 0.9; // max share of screen width / height
const EXPL_TITLE_H = 44;

const explLayer = document.getElementById('expl-layer');
const explEl = document.getElementById('explanation');
const explFrame = document.getElementById('expl-frame');
const explImg = document.getElementById('expl-img');
let explIdx = 0;

for (let i = 0; i < EXPL_COUNT; i++) { const im = new Image(); im.src = EXPL_SRC(i); } // preload

function explSize() {
  const ratio = (explImg.naturalWidth && explImg.naturalHeight)
    ? explImg.naturalWidth / explImg.naturalHeight : 4 / 3;
  const maxW = window.innerWidth * EXPL_W_MAX;
  const maxH = window.innerHeight * EXPL_H_MAX - EXPL_TITLE_H;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  explEl.style.width = Math.round(w) + 'px';
  explFrame.style.height = Math.round(h) + 'px';
}

function explShow(i) {
  explIdx = Math.max(0, Math.min(i, EXPL_COUNT - 1));
  explImg.src = EXPL_SRC(explIdx);
  explFrame.querySelectorAll('.expl-hot').forEach((el) => el.remove());
  const set = explIdx === 0 ? EXPL_HOT.first
            : explIdx === EXPL_COUNT - 1 ? EXPL_HOT.last
            : EXPL_HOT.middle;
  set.forEach((hs) => {
    const el = document.createElement('div');
    el.className = 'expl-hot' + (SHOW_HOTSPOTS ? ' debug' : '');
    el.style.left = hs.x + '%';  el.style.top = hs.y + '%';
    el.style.width = hs.w + '%'; el.style.height = hs.h + '%';
    el.addEventListener('click', () => explAction(hs.action));
    explFrame.appendChild(el);
  });
}

function explAction(a) {
  if (a === 'next') explShow(explIdx + 1);
  else if (a === 'prev') explShow(explIdx - 1);
  else explClose();
}
function explClose() { explLayer.classList.add('hidden'); }
function explOpen() {
  hideTooltip();
  explLayer.classList.remove('hidden');
  explShow(0);
  explSize();
}
function isExplOpen() { return !explLayer.classList.contains('hidden'); }

explImg.addEventListener('load', explSize);
explEl.querySelector('.expl-close').addEventListener('click', explClose);
window.addEventListener('resize', () => { if (isExplOpen()) explSize(); });
document.getElementById('explanation-btn').addEventListener('click', explOpen);
document.addEventListener('keydown', (e) => {
  if (!isExplOpen()) return;
  if (e.key === 'ArrowRight' && explIdx < EXPL_COUNT - 1) explShow(explIdx + 1);
  else if (e.key === 'ArrowLeft' && explIdx > 0) explShow(explIdx - 1);
  else if (e.key === 'Escape') explClose();
});
explSize();
explShow(0);

// ============================================================
// Round buttons: curve the label along the lower arc of the circle, so
// it sits further from the rim. Takes the text from each button's <span>.
// ============================================================
const BTN_ARC_RADIUS = 28;   // baseline radius in px (button radius is 32) — smaller = further from the rim
const BTN_ARC_MAX = 0.95;    // a label may cover at most this share of the half circle; longer ones get a smaller font
const BTN_ICON_SHIFT = -4;   // moves the icon up a little to make room for the label
(function curveButtonLabels() {
  const NS = 'http://www.w3.org/2000/svg';
  document.querySelectorAll('.reset-btn').forEach((btn, i) => {
    const span = btn.querySelector('span');
    if (!span) return;
    const label = span.textContent.trim();
    if (!btn.getAttribute('aria-label')) btn.setAttribute('aria-label', label);
    const icon = btn.querySelector('svg');
    if (icon) icon.style.transform = `translateY(${BTN_ICON_SHIFT}px)`;

    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'btn-arc');
    svg.setAttribute('viewBox', '0 0 64 64');
    const r = BTN_ARC_RADIUS;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('id', 'btn-arc-' + i);
    path.setAttribute('d', `M ${32 - r} 32 A ${r} ${r} 0 0 0 ${32 + r} 32`); // left → bottom → right
    path.setAttribute('fill', 'none');
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    const tp = document.createElementNS(NS, 'textPath');
    tp.setAttribute('href', '#btn-arc-' + i);
    tp.setAttribute('startOffset', '50%');
    tp.textContent = label.toUpperCase();
    text.appendChild(tp);
    svg.appendChild(path);
    svg.appendChild(text);
    span.replaceWith(svg);
    btn._arcText = text;
  });

  // shrink long labels (e.g. EXPLANATION) so they don't wrap too far around.
  // Measured once the button is visible (hidden views measure 0).
  function fitLabels() {
    const maxLen = Math.PI * BTN_ARC_RADIUS * BTN_ARC_MAX;
    document.querySelectorAll('.reset-btn').forEach((btn) => {
      const t = btn._arcText;
      if (!t || t._fitted) return;
      const len = t.getComputedTextLength();
      if (!len) return;
      if (len > maxLen) {
        const fs = parseFloat(getComputedStyle(t).fontSize);
        t.style.fontSize = (fs * maxLen / len).toFixed(2) + 'px';
      }
      t._fitted = true;
    });
  }
  fitLabels();
  document.addEventListener('click', () => requestAnimationFrame(fitLabels)); // after switching views
})();
</script>
